# Scratch workflow to iterate on Windows from a branch. Removed before merge.
name: windows-scratch
on:
  push:
    branches: [ci-windows]
permissions: {}
env:
  GO_VERSION: '1.27.4'
  CGO_ENABLED: '0'
defaults:
  run:
    shell: bash
jobs:
  win:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: CLI tests
        run: go test ./... 2>&1 | tee "$RUNNER_TEMP/t.txt"; exit ${PIPESTATUS[0]}
      - name: Runner tests
        if: always()
        working-directory: contract/runner
        run: go test ./... 2>&1
      - name: Build
        run: |
          (cd contract/runner && go build -o "$RUNNER_TEMP/jitso-contract.exe" .)
          go build -o "$RUNNER_TEMP/jitso.exe" ./cmd/jitso
      - name: Contract suite
        if: always()
        working-directory: contract
        run: |
          "$RUNNER_TEMP/jitso-contract.exe" --impl bin --bin "$RUNNER_TEMP/jitso.exe" --skip-tag posix --jobs 4 2>&1 | tail -400
          exit ${PIPESTATUS[0]}
