# JITSO build template, tier subagent. This is a DRAFT: it is not valid until every empty value is filled.
# A subagent is never launched alone: a worker or a conductor lists its id in subagents and hands it work.
# Its model, effort and tools must be in their lists of jitso/jitso.yaml when that file has them.
# Fill each empty value, then check the build with: jitso build validate <id>.
# A subagent does not take route_scope, budget, skills_first, mcp, requires or subagents.
id: <id>
version: 1
status: draft
tier: subagent
# description: one sentence the parent session reads to decide when to use this subagent.
description:
# prompt: the instructions the subagent runs with. Plain text, written for the subagent alone.
prompt:
# model: a full model id, never an alias. One of the models list of jitso/jitso.yaml when it has one.
model:
# effort: an effort name. One of the efforts list of jitso/jitso.yaml when it has one.
effort:
# tools: [a, b] limits the tools the subagent may use, by harness tool name. Without it the subagent inherits its parent's tools.
# tools: []
