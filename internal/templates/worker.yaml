# JITSO build template, tier worker. This is a DRAFT: it is not valid until every empty value is filled.
# A worker is one session started alone with: jitso launch --build <id> --brief <file>.
# Every model, effort, skill, MCP server and tool named here must be listed in jitso/jitso.yaml.
# Fill each empty value, then check the build with: jitso build validate <id>.
id: <id>
version: 1
status: draft
tier: worker
role: operator
# type: a short word for the kind of work (for example explorer, tester, automator).
type:
# work_kind: a short slug for the work this build does (for example repo-exploration).
work_kind:
# description: one sentence a launching session reads to choose this build.
description:
harness: claude
# model: a full model id from the models list of jitso/jitso.yaml. Never an alias.
model:
# effort: a value from the efforts list of jitso/jitso.yaml.
effort:
mode_default: direct
agents_md: full
# route_scope: optional. Ids of instruction sections the session works in. Leave it out for none.
# route_scope: [section-id]
# skills_first: skills the session loads before any other work, from the skills list of jitso/jitso.yaml.
skills_first: []
# tools: [a, b] limits the tools the session may use, from the tools list of jitso/jitso.yaml. Without it the harness default applies.
# tools: []
# mcp: MCP servers from the mcp list of jitso/jitso.yaml.
mcp: []
# subagents: names of subagent-tier builds this worker may hand work to. Each must be an approved build.
subagents: []
# requires: fields the launch must be given with --field name=value (for example ticket_key).
requires: []
# budget: optional. A mapping with the two numbers of a ceiling: { tokens: <number>, usd_list_cap: <number> }. Leave it out for a build with no budget.
budget:
# success: optional. The checks that say whether a launch did its job, one mapping per check with a check name of your own.
# Nothing in jitso evaluates them. Leave it out for none.
# success:
#   - { check: <name> }
