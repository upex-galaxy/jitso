# JITSO build template, tier worker. This is a DRAFT: it is not valid until every empty value is filled.
# A worker is one session started alone with: jitso launch --build <id> --brief <file>.
# A model, effort, skill, MCP server or tool must be in its list of jitso/jitso.yaml when that file has one.
# Without a list, a skill must be a folder of the project and a server one of .mcp.json.
# Fill each empty value, then check the build with: jitso build validate <id>.
id: <id>
version: 1
status: draft
tier: worker
role: operator
# type: a short word for the kind of work (for example explorer, tester, automator).
type:
# work_kind: a short slug for the work this build does (for example repo-exploration).
work_kind:
# description: one sentence a launching session reads to choose this build.
description:
harness: claude
# model: a full model id, never an alias. One of the models list of jitso/jitso.yaml when it has one.
model:
# effort: an effort name. One of the efforts list of jitso/jitso.yaml when it has one.
effort:
mode_default: direct
agents_md: full
# route_scope: optional. Ids of instruction sections the session works in. Leave it out for none.
# route_scope: [section-id]
# skills_first: skills the session loads before any other work.
skills_first: []
# tools: [a, b] limits the tools the session may use, by harness tool name. Without it the harness default applies.
# tools: []
# mcp: MCP servers, by their name in .mcp.json.
mcp: []
# subagents: names of subagent-tier builds this worker may hand work to. Each is an approved build, or in a draft another draft.
subagents: []
# requires: fields the launch must be given with --field name=value (for example ticket_key).
requires: []
# budget: optional. A mapping with the two numbers of a ceiling: { tokens: <number>, usd_list_cap: <number> }. Leave it out for a build with no budget.
budget:
